# CI/CD pipeline for nucheck (.NET global tool)
#
# Flow:  test  →  pack  →  sbom  →  sbom-publish  →  publish (auto on v* tag; manual on main)
#                                                 ↘  mirror-to-github (auto on v* tag; manual on main)
#
#   test            build + xUnit tests w/ coverage, format check, secret + SAST + Sonar scans
#   pack            `dotnet pack` the .nupkg tool, kept as a job artifact
#   sbom            generate a CycloneDX SBOM (every pipeline), kept as an artifact
#   sbom-publish    upload the SBOM to Dependency-Track on the default branch
#   publish         pushes the .nupkg to the private NuGet feed — auto on a v* tag, manual on main
#   mirror-to-github  pushes main + tags to the public GitHub mirror — auto on a v* tag, manual
#                     on main — once all core jobs pass; GitHub Actions CI then runs there
#                     (.github/workflows/ci.yml), which is what publishes to nuget.org
#
# Required CI/CD variables (Settings → CI/CD → Variables), "Protected" + "Masked":
#   REGISTRY_URL          private NuGet feed BASE host, e.g. https://nuget.example.com
#                         (the publish job appends /nuget/v3/index.json itself)
#   REGISTRY_PUBLISH_KEY  API key for `dotnet nuget push`. Protected + Masked;
#                         publish-scoped. REGISTRY_KEY is read-only and cannot push.
#   dependencyTrack_url   Dependency-Track base URL
#   dependencyTrack_token DT API key with BOM_UPLOAD + PROJECT_CREATION_UPLOAD perms
#   SNYK_TOKEN            Snyk (SAST) token. UNPROTECTED + masked so MR pipelines can scan.
#   SONAR_HOST_URL        SonarQube server URL (not a secret)
#   SONAR_TOKEN           SonarQube analysis token (masked)
#   GITHUB_TOKEN          GitHub PAT with Contents:write (classic: 'repo') on
#                         dependably/nucheck, used by mirror-to-github. Masked.

# Run ONE pipeline per change: a merge-request pipeline when an MR is open (so the
# full test suite runs in — and gates — the MR, not just snyk), the branch pipeline
# on the default branch, and tag pipelines — while suppressing the redundant branch
# pipeline when an MR is already open. Mirrors the python-check pipeline.
#
# Cancel superseded pipelines: when a new commit is pushed to a ref, cancel the
# still-running *interruptible* jobs from the previous commit's pipeline (saves
# runners). Side-effectful jobs (publish, sbom-publish) opt out with
# interruptible:false so an in-flight release/upload is never cut off.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true

stages:
  - test
  - pack
  - sbom
  - sbom-publish
  - publish
  - mirror

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "${CI_PROJECT_DIR}/.nuget/packages"

# Reusable NuGet restore cache (keyed on the project files).
.dotnet_cache: &dotnet_cache
  cache:
    key:
      files:
        - src/Dependably.NuCheck/Dependably.NuCheck.csproj
        - tests/Dependably.NuCheck.Tests/Dependably.NuCheck.Tests.csproj
    paths:
      - .nuget/packages/

build-test:
  stage: test
  <<: *dotnet_cache
  script:
    # --locked-mode fails the build if packages.lock.json is out of date with the
    # csproj — i.e. a dependency drifted or was tampered with without a committed lock.
    - dotnet restore Dependably.NuCheck.slnx --locked-mode
    - dotnet build Dependably.NuCheck.slnx -c Release --no-restore
    # coverlet.runsettings emits opencover (for Sonar) + cobertura (for GitLab).
    - dotnet test Dependably.NuCheck.slnx -c Release --no-build
      --settings coverlet.runsettings --collect:"XPlat Code Coverage"
      --results-directory ./coverage
  artifacts:
    when: always
    paths:
      - coverage/**/coverage.opencover.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/**/coverage.cobertura.xml
    expire_in: 1 week

format:
  stage: test
  <<: *dotnet_cache
  script:
    - dotnet format Dependably.NuCheck.slnx --verify-no-changes

# Secret scan — fail the pipeline if a committed secret is detected. Pinned by
# digest so the scanner version can't drift. GIT_DEPTH 0 fetches full history;
# prefer a fast incremental scan but fall back to FULL history when the "before"
# SHA is unusable (first push / force-push). --only-verified, --fail hard-fails.
secret-scan:
  stage: test
  image:
    name: trufflesecurity/trufflehog:3.95.3@sha256:9cc33bb080cac0efbbf228a17667172875b529eeeab01efcc4697adfb55f568a
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      BEFORE="${CI_COMMIT_BEFORE_SHA}"
      if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
        echo "No usable base commit (first push / force-push) — scanning full history"
        trufflehog git file://. --only-verified --fail
      else
        trufflehog git file://. --since-commit "$BEFORE" --only-verified --fail
      fi

# Snyk (SAST) — pinned-by-digest snyk/snyk image. Advisory for now
# (allow_failure:true); flip to false to make it a hard gate once triaged. The
# rules keep it out of the pipeline until SNYK_TOKEN exists (set UNPROTECTED +
# masked so MR pipelines on unprotected branches can read it).
snyk-code:
  stage: test
  image:
    name: snyk/snyk:linux@sha256:aeb296d943659dccbc7464340bb8741f6e11999cd99644dc92e6d315d6eda3f4
    entrypoint: [""]
  allow_failure: true
  rules:
    - if: '$SNYK_TOKEN'
  script:
    # SAST over the C# source (not a dependency scan — that would flag the
    # intentionally-vulnerable example fixtures). Matches the sibling pipelines.
    - snyk code test --severity-threshold=high

# SonarQube analysis + coverage via the .NET scanner (dotnet-sonarscanner), wrapped
# around the build so the analyzer sees the compilation. Main-only + allow_failure
# (advisory), reusing the existing project key. The scanner needs a JRE; SQ 9.9
# accepts coverage as OpenCover xml (sonar.cs.opencover.reportsPaths). sonar.login
# is the param the 9.9 server expects. Flip allow_failure to false for a hard gate.
sonarqube-check:
  stage: test
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SONAR_TOKEN'
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends openjdk-17-jre-headless
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:$HOME/.dotnet/tools"
  script:
    - dotnet sonarscanner begin
      /k:"DevAi_nuget-audit_AZ7hTtTJena5TNZ7ZTTX"
      /d:sonar.host.url="$SONAR_HOST_URL"
      /d:sonar.login="$SONAR_TOKEN"
      /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
    - dotnet build Dependably.NuCheck.slnx -c Release
    - dotnet test Dependably.NuCheck.slnx -c Release --no-build
      --settings coverlet.runsettings --collect:"XPlat Code Coverage"
      --results-directory ./coverage
    - dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"
  allow_failure: true

# Verifies the vendored conformance/dependably/ copy (tests/Dependably.NuCheck.Tests/
# conformance/) still matches the commit VENDOR.md pins it to. VENDOR.md records that
# provenance but proves nothing on its own — this turns the pin into a checked assertion
# instead of a comment nobody re-reads. It does NOT fail because the spec repo's main has
# moved on; sitting on an older commit is a legitimate, deliberate choice. It fails only
# when the local copy no longer matches what it claims to be pinned at.
vendor-corpus-check:
  stage: test
  image: alpine:3
  script:
    - apk add --no-cache git diffutils
    - sh ci/verify-vendored-corpus.sh tests/Dependably.NuCheck.Tests/conformance

pack:
  stage: pack
  <<: *dotnet_cache
  script:
    - dotnet pack src/Dependably.NuCheck/Dependably.NuCheck.csproj -c Release -o artifacts
  artifacts:
    paths:
      - artifacts/*.nupkg
    expire_in: 1 week

# Software Bill of Materials (CycloneDX). Generated every pipeline from the restored
# dependency graph and kept as an artifact. The CycloneDX dotnet tool is installed
# per-run (no global pin needed — it's advisory tooling, not a build input).
sbom:
  stage: sbom
  <<: *dotnet_cache
  script:
    - dotnet restore Dependably.NuCheck.slnx --locked-mode
    - dotnet tool install --global CycloneDX
    - export PATH="$PATH:$HOME/.dotnet/tools"
    # -spv 1.6: CycloneDX v6 defaults to spec 1.7, which the Dependency-Track
    # server rejects ("Unrecognized specVersion 1.7"). Pin to 1.6 (what DT accepts).
    - dotnet CycloneDX Dependably.NuCheck.slnx -o . -fn sbom.json -F Json -spv 1.6
  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days

# Publish the SBOM to Dependency-Track. Default branch only, serialized. autoCreate
# stands the project up on first upload; projectVersion tracks the package version
# (read from the csproj with sed since the alpine image has no dotnet). Hard-fails
# when the Dependency-Track variables aren't configured.
sbom-publish:
  stage: sbom-publish
  image: alpine:3
  interruptible: false
  needs:
    - job: sbom
      artifacts: true
  resource_group: sbom-publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apk add --no-cache curl
    - |
      if [ -z "$dependencyTrack_url" ] || [ -z "$dependencyTrack_token" ]; then
        echo "ERROR: dependencyTrack_url and dependencyTrack_token must be set as CI/CD variables." >&2
        exit 1
      fi
    - |
      set -eu
      if [ ! -s sbom.json ]; then
        echo "ERROR: sbom.json (from the sbom job artifact) is missing." >&2
        ls -la >&2
        exit 1
      fi
      BASE="${dependencyTrack_url%/}"
      PROJECT="Dependably.NuCheck"
      VERSION=latest
      echo "Publishing SBOM ($(wc -c < sbom.json) bytes) for $PROJECT@$VERSION to $BASE"
      status=$(curl -sS -o /tmp/bom.out -w '%{http_code}' \
        -X POST "$BASE/api/v1/bom" \
        -H "X-Api-Key: $dependencyTrack_token" \
        --form-string "autoCreate=true" \
        --form-string "projectName=$PROJECT" \
        --form-string "projectVersion=$VERSION" \
        -F "bom=@sbom.json")
      case "$status" in
        200) echo "SBOM uploaded";;
        *) echo "SBOM upload failed (HTTP $status):" >&2; cat /tmp/bom.out >&2; exit 1;;
      esac

# Push the .nupkg to the private NuGet feed. Runs automatically at the end of a v* tag
# pipeline (a tag is a release); on the default branch it stays a manual gate. Serialized.
# Bump <Version> in the csproj to release — pushing an existing version fails unless the
# feed allows overwrite (--skip-duplicate tolerates re-runs).
# REGISTRY_URL is the feed's BASE host (e.g. https://nuget.example.com);
# this job appends the v3 service-index path. dotnet nuget push needs the index.json
# (it reads the PackagePublish resource from it) — given a bare host it would guess the
# legacy /api/v2/package path and 404 against a v3-only feed.
publish:
  stage: publish
  interruptible: false
  dependencies:
    - pack
  resource_group: publish
  rules:
    # A v* tag is a release: publish automatically at the end of the tag pipeline.
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
      allow_failure: false
    # On the default branch, keep it a manual gate (publish without tagging if ever needed).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
  script:
    - |
      # REGISTRY_PUBLISH_KEY is the publish credential: protected + masked, so it
      # resolves only on protected refs. REGISTRY_KEY is the unprotected read token
      # and is scoped read-only on the registry — it cannot push, so it is not
      # accepted here even as a fallback. An empty value on a protected ref means
      # the variable is missing or the ref is not actually protected.
      if [ -z "$REGISTRY_URL" ] || [ -z "$REGISTRY_PUBLISH_KEY" ]; then
        echo "ERROR: REGISTRY_URL and REGISTRY_PUBLISH_KEY must be set as CI/CD variables." >&2
        echo "       REGISTRY_PUBLISH_KEY must be Protected + Masked; if it is set and still" >&2
        echo "       empty here, this ref is not protected (add 'v*' to Protected Tags)." >&2
        exit 1
      fi
    - |
      # On a tag pipeline, the tag MUST equal the packed <Version>, or we would publish a
      # mismatched version to the feed. (No-op on default-branch manual runs — CI_COMMIT_TAG
      # is empty there.) Mirrors the tag<->version guard in the GitHub release job.
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VER="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Dependably.NuCheck/Dependably.NuCheck.csproj | head -1)"
        if [ "${CI_COMMIT_TAG#v}" != "$VER" ]; then
          echo "ERROR: tag $CI_COMMIT_TAG does not match csproj <Version> $VER; refusing to publish." >&2
          exit 1
        fi
      fi
    - PKG=$(ls artifacts/*.nupkg)
    # Build the v3 service index from the base host (tolerate a trailing slash).
    - FEED="${REGISTRY_URL%/}/nuget/v3/index.json"
    - echo "Publishing $PKG to $FEED"
    - dotnet nuget push "$PKG" --source "$FEED" --api-key "$REGISTRY_PUBLISH_KEY" --skip-duplicate

# Mirror the default branch (+ tags) to the public GitHub repo. Runs automatically at the
# end of a v* tag pipeline — carrying the tag to GitHub fires the GitHub Actions release
# job (pack -> SLSA provenance -> nuget.org -> GitHub Release) — and stays a manual gate on
# the default branch (to sync docs/CI between releases). `needs:` lists the deterministic
# gating jobs so this can
# only run after they pass (the advisory allow_failure scans — snyk-code,
# sonarqube-check — and the side-effecting sbom-publish are intentionally not
# blockers). It runs independently of the `publish` manual gate.
#
# GIT_DEPTH 0 fetches full history so the push isn't a shallow-clone fragment.
# Non-fast-forward pushes fail by design (no --force): GitHub is a downstream
# mirror of main, so divergence should surface as an error, not silently clobber.
mirror-to-github:
  stage: mirror
  interruptible: false
  resource_group: mirror-to-github
  variables:
    GIT_DEPTH: 0
  needs:
    - job: build-test
    - job: format
    - job: secret-scan
    - job: pack
    - job: sbom
  rules:
    # A v* tag is a release: mirror main + the tag to GitHub automatically, which fires the
    # GitHub Actions release job (pack -> provenance -> nuget.org publish -> GitHub Release).
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
      allow_failure: false
    # On the default branch, keep it a manual gate (sync docs/CI to GitHub between releases).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
  script:
    - |
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "ERROR: GITHUB_TOKEN must be set as a CI/CD variable (GitHub PAT with Contents:write / 'repo' on dependably/nucheck)." >&2
        exit 1
      fi
    - |
      set -eu
      # Token is passed via the remote URL (not echoed); GitLab masks the variable in logs.
      git remote remove github 2>/dev/null || true
      git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/dependably/nucheck.git"
      echo "Mirroring ${CI_DEFAULT_BRANCH} + tags to github.com/dependably/nucheck"
      git push github "HEAD:refs/heads/${CI_DEFAULT_BRANCH}"
      git push github --tags
      git remote remove github
