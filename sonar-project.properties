# SonarQube analysis configuration for nuget-check.
#
# Non-secret structural settings live here. The secret/per-environment values
# (sonar.host.url, the auth token, sonar.projectVersion) are passed on the command
# line by the `sonarqube-check` CI job. The project key defaults below and is
# overridden by $SONAR_PROJECT_KEY only when that CI variable is set.

# Server-assigned project key for the existing Sonar project (provisioned under
# the DevAi org). $SONAR_PROJECT_KEY in CI/CD variables overrides it if the
# project is later re-provisioned under moonlitlabs.
sonar.projectKey=DevAi_nuget-audit_AZ7hTtTJena5TNZ7ZTTX
sonar.projectName=nuget-check

# Block the scan on the server-side quality gate and fail if it is not green.
# The sonarqube-check job is allow_failure:true, so this surfaces the gate result
# without blocking the pipeline; flip that to false to make it a hard merge gate.
sonar.qualitygate.wait=true

# Production code under analysis (sources live at the repo root). Tests are
# declared separately so Sonar scopes coverage and issue rules correctly.
sonar.sources=index.js,cli.js,utils
sonar.tests=tests

# Jest emits lcov at coverage/lcov.info (default reporter set).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Keep generated/vendored trees out of analysis.
sonar.exclusions=node_modules/**,coverage/**,.npm/**
sonar.coverage.exclusions=tests/**

sonar.sourceEncoding=UTF-8
